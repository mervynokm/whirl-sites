<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Whirl logo, monochrome">
  <title>Whirl — Open Whirl mark (v2, monochrome)</title>
  <!--
    Monochrome / accessibility variant of Open Whirl v2. Same two-arm
    geometry as whirl-logo-open-whirl.svg (same taper, gap, counter-arm,
    trailing dots, center halo) so it reads as the same mark at any
    contrast setting. Colour layering is reproduced as opacity layering:
    the back arm, dots, and halo drop to partial black opacity so the
    front orange-equivalent arm still reads as the dominant shape.
    Pure black on transparent — for print B&W, high-contrast mode, and
    single-colour stamping.
  -->

